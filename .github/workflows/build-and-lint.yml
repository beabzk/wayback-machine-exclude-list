name: Build & Test Exclude List

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build exclude-list.txt
        run: bash scripts/build.sh

      - name: Run lint and test suite
        run: bash scripts/test.sh

      - name: Commit and push generated exclude-list.txt
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f exclude-list.txt
          if git diff --staged --quiet; then
            echo "exclude-list.txt is up to date."
          else
            git commit -m "Auto-build exclude-list.txt [skip ci]"
            git push
          fi
